name: FreshnessGuard checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.run
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: bash scripts/build-plugin.sh
      - run: python -m scripts.native_smoke --upstream "$PWD/work/bifrost"
      - run: bash scripts/build-gateway.sh
      - run: python -m scripts.gateway_smoke
